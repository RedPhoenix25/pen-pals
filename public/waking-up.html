<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen Pals — Waking up...</title>
    <meta name="description" content="Pen Pals is starting up. Please wait a moment." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #171513;
        --bg-2: #1c1917;
        --text: #e6e4e1;
        --muted: #57534e;
        --dim: #292524;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }

      /* Noise texture overlay */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        background-size: 200px 200px;
        pointer-events: none;
        z-index: 0;
      }

      /* Vignette */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
        z-index: 0;
      }

      .scene {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Wordmark */
      .wordmark {
        font-family: 'EB Garamond', Georgia, serif;
        font-size: clamp(36px, 8vw, 64px);
        font-weight: 400;
        letter-spacing: 0.06em;
        color: var(--text);
        opacity: 0;
        animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
        user-select: none;
      }

      .wordmark em {
        font-style: italic;
        color: #a8a29e;
      }

      /* Quill icon */
      .quill-wrap {
        margin-top: 40px;
        opacity: 0;
        animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        color: var(--muted);
      }

      .quill-svg {
        width: 28px;
        height: 28px;
      }

      .quill-path {
        stroke-dasharray: 140;
        stroke-dashoffset: 140;
        animation: drawPath 1.6s ease 0.9s forwards;
      }

      /* Ink line */
      .ink-line {
        width: 0;
        height: 1px;
        background: linear-gradient(to right, transparent, var(--muted), transparent);
        margin-top: 28px;
        opacity: 0;
        animation: expandLine 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
      }

      /* Status */
      .status {
        margin-top: 32px;
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
        animation: fadeIn 0.8s ease 1.5s forwards;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Dot pulse */
      .dots {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--muted);
        animation: pulseDot 1.4s ease-in-out infinite;
      }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      /* Progress bar */
      .progress-track {
        margin-top: 48px;
        width: clamp(100px, 18vw, 180px);
        height: 1px;
        background: var(--dim);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        animation: fadeIn 0.6s ease 1.7s forwards;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #78716c;
        border-radius: 2px;
        transition: width 0.5s ease;
      }

      /* Keyframes */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      @keyframes expandLine {
        from { width: 0; opacity: 0; }
        to   { width: clamp(50px, 10vw, 100px); opacity: 1; }
      }

      @keyframes drawPath {
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseDot {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%            { opacity: 1;   transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="scene">

      <div class="wordmark"><em>pen</em> pals</div>

      <div class="quill-wrap">
        <svg class="quill-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path class="quill-path" d="M20 3C20 3 13 5 9 11C5 17 5 21 5 21L8.5 17.5C8.5 17.5 9.5 14.5 12.5 12.5C12.5 12.5 10.5 16.5 12 20C12 20 16 14 18 10C20 6 20 3 20 3Z"/>
        </svg>
      </div>

      <div class="ink-line"></div>

      <div class="status">
        <span id="status-label">waking up</span>
        <span class="dots" id="dots-wrap">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

    </div>

    <script>
      const TARGET_URL = '/';
      const HEALTH_ENDPOINT = '/api/health';
      const POLL_INTERVAL_MS = 2500;
      const MAX_WAIT_MS = 60000;

      const labelEl = document.getElementById('status-label');
      const dotsEl = document.getElementById('dots-wrap');
      const progressEl = document.getElementById('progress-fill');

      const started = Date.now();
      let currentProgress = 0;

      function setProgress(pct) {
        currentProgress = Math.max(currentProgress, Math.min(pct, 100));
        progressEl.style.width = currentProgress + '%';
      }

      // Fake eased progress — approaches 85% asymptotically
      function tickFakeProgress() {
        const t = (Date.now() - started) / MAX_WAIT_MS;
        const fake = 85 * (1 - Math.exp(-5 * t));
        setProgress(fake);
      }

      const fakeTimer = setInterval(tickFakeProgress, 400);

      async function checkReady() {
        try {
          const res = await fetch(HEALTH_ENDPOINT, {
            method: 'GET',
            cache: 'no-store',
            signal: AbortSignal.timeout(4500),
          });
          return res.ok;
        } catch (_) {
          return false;
        }
      }

      function redirectNow() {
        clearInterval(fakeTimer);
        setProgress(100);
        labelEl.textContent = 'ready';
        dotsEl.style.display = 'none';
        setTimeout(() => {
          window.location.replace(TARGET_URL);
        }, 500);
      }

      async function poll() {
        const ready = await checkReady();
        if (ready) { redirectNow(); return; }

        const elapsed = Date.now() - started;
        if (elapsed >= MAX_WAIT_MS) { redirectNow(); return; }

        setTimeout(poll, POLL_INTERVAL_MS);
      }

      // Give animations time to play before first poll
      setTimeout(poll, 2000);
    </script>
  </body>
</html>
